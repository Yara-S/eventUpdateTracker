<body>

```
<h1>Event Results</h1>


<!-- GraphQL configuration -->

<div class="config">

    <div class="field">

        <label for="endpoint">
            GraphQL Endpoint
        </label>

        <input
            id="endpoint"
            type="text"
            placeholder="https://xxxxxxxxxx.appsync-api.ap-southeast-2.amazonaws.com/graphql"
        />

    </div>


    <div class="field">

        <label for="apiKey">
            API Key
        </label>

        <input
            id="apiKey"
            type="text"
            placeholder="Enter API key"
        />

    </div>

</div>


<!-- Event search -->

<div class="search">

    <input
        id="eventId"
        type="text"
        placeholder="Enter Event ID"
    />

    <button onclick="getEventData()">
        Search
    </button>

</div>


<div id="loading" class="loading">
    Loading...
</div>

<div id="result"></div>

<div id="error" class="error"></div>


<script>

    async function getEventData() {

        const endpoint =
            document.getElementById('endpoint').value.trim();

        const apiKey =
            document.getElementById('apiKey').value.trim();

        const eventId =
            document.getElementById('eventId').value.trim();


        const resultElement =
            document.getElementById('result');

        const errorElement =
            document.getElementById('error');

        const loadingElement =
            document.getElementById('loading');


        resultElement.innerHTML = '';

        errorElement.innerHTML = '';


        /*
         * Validate endpoint
         */

        if (!endpoint) {

            errorElement.innerText =
                'Please enter the GraphQL endpoint.';

            return;
        }


        /*
         * Validate API key
         */

        if (!apiKey) {

            errorElement.innerText =
                'Please enter the API key.';

            return;
        }


        /*
         * Validate Event ID
         */

        if (!eventId) {

            errorElement.innerText =
                'Please enter an Event ID.';

            return;
        }


        loadingElement.style.display =
            'block';


        /*
         * GraphQL query
         */

        const query = `
            query GetEventData($eventId: ID!) {

                events

                results(eventId: $eventId) {

                    bib
                    lane
                    revision
                    status
                    timeMs

                }

                eventStats(eventId: $eventId) {

                    eventId
                    athletesTracked
                    updatesAccepted
                    updatesIgnored

                }

                updatesRejected

            }
        `;


        try {

            const response = await fetch(
                endpoint,
                {
                    method: 'POST',

                    headers: {
                        'Content-Type':
                            'application/json',

                        'x-api-key':
                            apiKey
                    },

                    body: JSON.stringify({

                        query: query,

                        variables: {
                            eventId: eventId
                        }

                    })
                }
            );


            const data =
                await response.json();


            /*
             * Check HTTP errors
             */

            if (!response.ok) {

                throw new Error(
                    `HTTP ${response.status}: ${response.statusText}`
                );

            }


            /*
             * Check GraphQL errors
             */

            if (data.errors) {

                throw new Error(
                    data.errors
                        .map(error => error.message)
                        .join(', ')
                );

            }


            const eventData =
                data.data;


            /*
             * Extract data
             */

            const results =
                eventData.results || [];

            const eventStats =
                eventData.eventStats;

            const events =
                eventData.events || [];

            const updatesRejected =
                eventData.updatesRejected;


            /*
             * Build Results section
             */

            let resultsHtml = `
                <div class="section">

                    <h2>Results</h2>
            `;


            if (results.length === 0) {

                resultsHtml += `
                    <p class="empty">
                        No results found for this event.
                    </p>
                `;

            } else {

                resultsHtml += `

                    <table>

                        <thead>

                            <tr>
                                <th>BIB</th>
                                <th>Lane</th>
                                <th>Revision</th>
                                <th>Status</th>
                                <th>Time (ms)</th>
                            </tr>

                        </thead>

                        <tbody>
                `;


                results.forEach(result => {

                    resultsHtml += `

                        <tr>

                            <td>
                                ${escapeHtml(result.bib)}
                            </td>

                            <td>
                                ${result.lane}
                            </td>

                            <td>
                                ${result.revision}
                            </td>

                            <td>
                                ${escapeHtml(result.status)}
                            </td>

                            <td>
                                ${result.timeMs}
                            </td>

                        </tr>

                    `;

                });


                resultsHtml += `

                        </tbody>

                    </table>

                `;

            }


            resultsHtml += `
                </div>
            `;


            /*
             * Build EventStats section
             */

            let statsHtml = `
                <div class="section">

                    <h2>Event Statistics</h2>

                    <div class="stats">
            `;


            if (!eventStats) {

                statsHtml += `
                    <p class="empty">
                        No event statistics found.
                    </p>
                `;

            } else {

                statsHtml += `

                    <div class="row">

                        <div class="label">
                            Event ID
                        </div>

                        <div>
                            ${escapeHtml(
                                eventStats.eventId
                            )}
                        </div>

                    </div>


                    <div class="row">

                        <div class="label">
                            Athletes Tracked
                        </div>

                        <div>
                            ${eventStats.athletesTracked}
                        </div>

                    </div>


                    <div class="row">

                        <div class="label">
                            Updates Accepted
                        </div>

                        <div>
                            ${eventStats.updatesAccepted}
                        </div>

                    </div>


                    <div class="row">

                        <div class="label">
                            Updates Ignored
                        </div>

                        <div>
                            ${eventStats.updatesIgnored}
                        </div>

                    </div>

                `;

            }


            statsHtml += `
                    </div>

                </div>
            `;


            /*
             * Build Global statistics section
             */

            const globalStatsHtml = `

                <div class="section">

                    <h2>Global Statistics</h2>

                    <div class="stats">

                        <div class="row">

                            <div class="label">
                                Updates Rejected
                            </div>

                            <div>
                                ${updatesRejected}
                            </div>

                        </div>

                    </div>

                </div>

            `;


            /*
             * Build Events section
             */

            let eventsHtml = `

                <div class="section">

                    <h2>Events</h2>

            `;


            if (events.length === 0) {

                eventsHtml += `
                    <p class="empty">
                        No events found.
                    </p>
                `;

            } else {

                eventsHtml += '<ul>';

                events.forEach(event => {

                    eventsHtml += `
                        <li>
                            ${escapeHtml(event)}
                        </li>
                    `;

                });

                eventsHtml += '</ul>';

            }


            eventsHtml += `
                </div>
            `;


            /*
             * Display everything
             */

            resultElement.innerHTML =
                resultsHtml +
                statsHtml +
                globalStatsHtml +
                eventsHtml;

        }

        catch (error) {

            console.error(error);

            errorElement.innerText =
                'Error: ' + error.message;

        }

        finally {

            loadingElement.style.display =
                'none';

        }

    }


    /*
     * Escape HTML to safely display
     * values returned by GraphQL.
     */

    function escapeHtml(value) {

        return String(value)

            .replaceAll(
                '&',
                '&amp;'
            )

            .replaceAll(
                '<',
                '&lt;'
            )

            .replaceAll(
                '>',
                '&gt;'
            )

            .replaceAll(
                '"',
                '&quot;'
            )

            .replaceAll(
                "'",
                '&#039;'
            );

    }

</script>
