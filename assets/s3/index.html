<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Results</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 40px auto;
            padding: 0 20px;
        }

        h1 {
            margin-bottom: 30px;
        }

        .config {
            margin-bottom: 30px;
        }

        .field {
            margin-bottom: 15px;
        }

        .field label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 10px;
            font-size: 16px;
        }

        .search {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
        }

        .search input {
            flex: 1;
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
        }

        .result {
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 20px;
        }

        .row {
            display: flex;
            margin-bottom: 10px;
        }

        .label {
            width: 120px;
            font-weight: bold;
        }

        .loading {
            display: none;
        }

        .error {
            color: #c00;
            margin-top: 20px;
        }
    </style>
</head>

<body>

    <h1>Results</h1>


    <!-- GraphQL configuration -->

    <div class="config">

        <div class="field">

            <label for="endpoint">
                GraphQL Endpoint
            </label>

            <input
                id="endpoint"
                type="text"
                placeholder="https://xxxxxxxxxx.appsync-api.ap-southeast-2.amazonaws.com/graphql"
            />

        </div>


        <div class="field">

            <label for="apiKey">
                API Key
            </label>

            <input
                id="apiKey"
                type="text"
                placeholder="Enter API key"
            />

        </div>

    </div>


    <!-- BIB search -->

    <div class="search">

        <input
            id="bib"
            type="text"
            placeholder="Enter BIB"
        />

        <button onclick="getResult()">
            Search
        </button>

    </div>


    <div id="loading" class="loading">
        Loading...
    </div>

    <div id="result"></div>

    <div id="error" class="error"></div>


    <script>

        async function getResult() {

            const endpoint =
                document.getElementById('endpoint').value.trim();

            const apiKey =
                document.getElementById('apiKey').value.trim();

            const bib =
                document.getElementById('bib').value.trim();


            const resultElement =
                document.getElementById('result');

            const errorElement =
                document.getElementById('error');

            const loadingElement =
                document.getElementById('loading');


            resultElement.innerHTML = '';

            errorElement.innerHTML = '';


            /*
             * Validate endpoint
             */

            if (!endpoint) {

                errorElement.innerText =
                    'Please enter the GraphQL endpoint.';

                return;
            }


            /*
             * Validate API key
             */

            if (!apiKey) {

                errorElement.innerText =
                    'Please enter the API key.';

                return;
            }


            /*
             * Validate BIB
             */

            if (!bib) {

                errorElement.innerText =
                    'Please enter a BIB.';

                return;
            }


            loadingElement.style.display =
                'block';


            const query = `
                query GetResult($bib: String!) {

                    getResult(bib: $bib) {

                        bib
                        revision
                        eventId

                    }
                }
            `;


            try {

                const response = await fetch(
                    endpoint,
                    {
                        method: 'POST',

                        headers: {
                            'Content-Type':
                                'application/json',

                            'x-api-key':
                                apiKey
                        },

                        body: JSON.stringify({

                            query: query,

                            variables: {
                                bib: bib
                            }

                        })
                    }
                );


                const data =
                    await response.json();


                /*
                 * Check HTTP errors
                 */

                if (!response.ok) {

                    throw new Error(
                        `HTTP ${response.status}: ${response.statusText}`
                    );

                }


                /*
                 * Check GraphQL errors
                 */

                if (data.errors) {

                    throw new Error(
                        data.errors[0].message
                    );

                }


                const result =
                    data.data.getResult;


                /*
                 * No result
                 */

                if (!result) {

                    resultElement.innerHTML =
                        '<p>No result found.</p>';

                    return;

                }


                /*
                 * Display result
                 */

                resultElement.innerHTML = `

                    <div class="result">

                        <div class="row">

                            <div class="label">
                                BIB
                            </div>

                            <div>
                                ${escapeHtml(result.bib)}
                            </div>

                        </div>


                        <div class="row">

                            <div class="label">
                                Revision
                            </div>

                            <div>
                                ${result.revision}
                            </div>

                        </div>


                        <div class="row">

                            <div class="label">
                                Event ID
                            </div>

                            <div>
                                ${escapeHtml(
                                    result.eventId || ''
                                )}
                            </div>

                        </div>

                    </div>

                `;

            }

            catch (error) {

                console.error(error);

                errorElement.innerText =
                    'Error: ' + error.message;

            }

            finally {

                loadingElement.style.display =
                    'none';

            }

        }


        function escapeHtml(value) {

            return String(value)

                .replaceAll(
                    '&',
                    '&amp;'
                )

                .replaceAll(
                    '<',
                    '&lt;'
                )

                .replaceAll(
                    '>',
                    '&gt;'
                )

                .replaceAll(
                    '"',
                    '&quot;'
                )

                .replaceAll(
                    "'",
                    '&#039;'
                );

        }

    </script>

</body>

</html>
